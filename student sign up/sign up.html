<article>
  <section>
    <h3>STUDENT LOGIN</h3>
    <form>
      <label for="First name">First name</label>
      <input type="text" id="First name" name="First name" placeholder="Enter your First Name" required>

      <label for="Last Name">Last Name</label>
      <input type="text" id="Last Name" name="Last Name" placeholder="Enter your Last Name" required>

      <label for="Age">Age</label>
      <input type="number" id="Age" name="Age" placeholder="Enter your Age" required>

      <label for="Gender">Gender</label>
      <input type="text" id="Gender" name="Gender" placeholder="Enter your name" required>

      <label for="Email">Email</label>
      <input type="email" id="Email" name="Email" placeholder="Enter your email" required>

      <label for="School">School</label>
      <input type="text" id="School" name="School" placeholder="Enter your School" required minlength="4" maxlength="150">

      <label for="Form">Form</label>
      <input type="number" id="Form" name="Form" placeholder="Enter your Form" required maxlength="5">

      <label for="Parents first name">Parents first name</label>
      <input type="text" id="Parents first name" name="Parents first name" placeholder="Enter your Parents first name" required>

      <label for="Parents last name">Parents last name</label>
      <input type="text" id="Parents last name" name="Parents last name" placeholder="Enter your Parents last name" required>

      <label for="Parent's email address">Parents's email address</label>
      <input type="email" id="Parent's email address" placeholder="Enter your Parents's email address" required>

      <label for="Parent's contact number">Parent's contact number</label>
      <input type="number" id="Parent's contact number" placeholder="Enter your Parent's contact number" required>

      <h4>What kind of Student are you?</h4>
      <label for="New Student">New Student</label>
      <input type="checkbox" id="New Student" name="New Student" required>

      <label for="Continuing Student">Continuing Student</label>
      <input type="checkbox" id="Continuing Student" name="Continuing Student" required>

      <label for="Repeating Student">Repeating Student</label>
      <input type="checkbox" id="Repeating Student" name="Repeating Student" required>

      <h3>Click Here to Sign Up Now!</h3>
      <button id="Sign Up">Sign Up!</button>
    </form>
  </section>
</article>
